# SonarQube / SonarCloud project configuration.
#
# If using SonarCloud (https://sonarcloud.io - free for public repos):
#   1. Create an account and import this GitHub repository.
#   2. Replace "your-sonarcloud-org" below with your actual organization key.
#   3. Generate a token and add it as the GitHub secret SONAR_TOKEN.
#   4. Add SONAR_HOST_URL = https://sonarcloud.io as a GitHub secret.
#
# If using a self-hosted SonarQube instance (see docker-compose.sonarqube.yml):
#   1. Start it locally: docker compose -f docker-compose.sonarqube.yml up -d
#   2. Open http://localhost:9000 (default login: admin / admin), create a project.
#   3. Generate a token and set SONAR_TOKEN / SONAR_HOST_URL as GitHub secrets
#      (or as local environment variables when testing scripts locally).

sonar.projectKey=healthsec-devsecops-framework
sonar.organization=your-sonarcloud-org
sonar.projectName=Healthcare DevSecOps Risk Assessment Framework

sonar.sources=backend/app
sonar.tests=backend/tests
sonar.python.version=3.11

sonar.exclusions=**/node_modules/**,**/dist/**,**/*.pyc,**/venv/**
