# Fallback deployment: all three containers on one EC2 instance.
# Builds the images from source on the server.
#
# Usage (on the server, in the project folder, with a .env.prod file):
#   DC="sudo docker compose --env-file .env.prod -f docker-compose.ec2.yml"
#   $DC up -d --build
#
# .env.prod must define POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DATABASE_URL,
# JWT_SECRET_KEY, JWT_ALGORITHM, ACCESS_TOKEN_EXPIRE_MINUTES, DEMO_USERNAME,
# DEMO_PASSWORD, CORS_ORIGINS, DEPLOYMENT_MANDATORY_SCANNERS and VITE_API_URL.
# Never commit .env.prod.
services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      - db
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
volumes:
  pg_data:
