server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing - any path that isn't a real
    # file should fall back to index.html so deep links (e.g. /dashboard)
    # work on a hard refresh, not just via in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets; index.html itself is
    # NOT cached so new deployments are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
