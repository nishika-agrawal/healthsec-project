name: DevSecOps Pipeline

# Runs on every push and every pull request, to any branch.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history is recommended for accurate SonarQube analysis.
          fetch-depth: 0

      # ---------------------------------------------------------------
      # Backend: install, test
      # ---------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v

      # ---------------------------------------------------------------
      # Frontend: install, build
      # ---------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---------------------------------------------------------------
      # Build the Docker image (Trivy scans this image below)
      # ---------------------------------------------------------------
      - name: Build backend Docker image
        run: docker build -t healthsec-backend:${{ github.sha }} ./backend

      # ---------------------------------------------------------------
      # SonarQube static analysis (SAST)
      # Skips gracefully if SONAR_TOKEN / SONAR_HOST_URL secrets are not set,
      # so the rest of the pipeline still runs for students who haven't
      # configured SonarCloud/SonarQube yet.
      # ---------------------------------------------------------------
      - name: SonarQube Scan
        if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch SonarQube report
        if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: healthsec-devsecops-framework
        run: python scripts/fetch_sonarqube_report.py

      - name: Record missing SonarQube configuration
        if: ${{ secrets.SONAR_TOKEN == '' || secrets.SONAR_HOST_URL == '' }}
        run: python scripts/record_missing_sonar.py

      # ---------------------------------------------------------------
      # Trivy container image scan
      # exit-code 0 means vulnerabilities found do NOT fail this step -
      # the deployment decision (Phase 8) is what acts on severity, not
      # the scan step itself.
      # ---------------------------------------------------------------
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: healthsec-backend:${{ github.sha }}
          format: json
          output: reports/trivy/trivy-report.json
          exit-code: "0"
          severity: "LOW,MEDIUM,HIGH,CRITICAL"

      # ---------------------------------------------------------------
      # OWASP Dependency-Check (software composition analysis)
      # ---------------------------------------------------------------
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        with:
          project: "healthsec-devsecops-framework"
          path: "."
          format: "JSON"
          out: "reports/dependency-check"

      - name: Normalize Dependency-Check report filename
        run: |
          mkdir -p reports/dependency-check
          if [ -f reports/dependency-check/dependency-check-report.json ]; then
            echo "Dependency-Check report already at the expected path."
          elif [ -f reports/dependency-check/report.json ]; then
            mv reports/dependency-check/report.json reports/dependency-check/dependency-check-report.json
          else
            echo "::warning::Dependency-Check did not produce a report at the expected location."
          fi

      # ---------------------------------------------------------------
      # Validate and summarize whatever reports were produced.
      # This never silently treats a missing/broken report as "clean".
      # ---------------------------------------------------------------
      - name: Validate security reports
        run: python scripts/validate_reports.py

      - name: Upload security reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: reports/
          retention-days: 14

  # ---------------------------------------------------------------------
  # Phase 10: build production images and push them to GitHub Container
  # Registry. Only runs for real pushes to main - not pull requests, and
  # not on other branches - since this is what will actually be deployed.
  # ---------------------------------------------------------------------
  build-and-push-images:
    needs: build-test-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute lowercase image name prefix
        id: image_name
        run: echo "prefix=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.image_name.outputs.prefix }}-backend:latest
            ghcr.io/${{ steps.image_name.outputs.prefix }}-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ghcr.io/${{ steps.image_name.outputs.prefix }}-frontend:latest
            ghcr.io/${{ steps.image_name.outputs.prefix }}-frontend:${{ github.sha }}

  # ---------------------------------------------------------------------
  # Phase 10: automated deployment gate. Re-runs the SAME pipeline the
  # FastAPI backend uses (Phases 5-8) against this run's actual scan
  # reports, and decides approved / review_required / blocked. If the
  # decision is "blocked", this job's gate step exits non-zero, which
  # fails this job - and because the "deploy" job below requires this
  # job to succeed, deployment is automatically skipped. No separate
  # "did it fail" check is needed anywhere else in the workflow.
  # ---------------------------------------------------------------------
  deployment-gate:
    needs: build-test-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      risk_category: ${{ steps.gate.outputs.risk_category }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download this run's security reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: reports/

      - name: Run deployment gate
        id: gate
        working-directory: backend
        run: |
          python -m app.deployment.gate_cli \
            --app-name healthsec-demo \
            --commit-sha ${{ github.sha }} \
            --trivy-report ../reports/trivy/trivy-report.json \
            --dependency-check-report ../reports/dependency-check/dependency-check-report.json \
            --sonarqube-report ../reports/sonarqube/sonarqube-report.json \
            --output-path ../deployment_decision.json

      - name: Upload deployment decision artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-decision-${{ github.sha }}
          path: deployment_decision.json

  # ---------------------------------------------------------------------
  # Phase 10: deploy to AWS EC2 over SSH. Only reachable at all if
  # deployment-gate succeeded (i.e. the decision was NOT "blocked" - see
  # above). "review_required" and "approved" builds are routed to
  # different GitHub Environments so a repo admin can require manual
  # approval for one but not the other (configure these in the repo's
  # Settings -> Environments: "production" with no protection rules for
  # instant deploys, "production-review" with a required reviewer).
  # ---------------------------------------------------------------------
  deploy:
    needs: [build-and-push-images, deployment-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ needs.deployment-gate.outputs.decision == 'review_required' && 'production-review' || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,infra/deploy.sh"
          target: "/opt/healthsec/"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            chmod +x /opt/healthsec/infra/deploy.sh
            /opt/healthsec/infra/deploy.sh
